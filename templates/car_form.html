{% extends "base.html" %}
{% block content %}
<h1>{{ 'Araç Düzenle' if car else 'Yeni Araç Ekle' }}</h1>
<form class="form" method="post" enctype="multipart/form-data">
  <label>Marka<input name="brand" required value="{{ car.brand if car else '' }}" placeholder="Renault"></label>
  <label>Model<input name="model" required value="{{ car.model if car else '' }}" placeholder="Clio"></label>
  <label>Plaka<input name="plate" value="{{ car.plate if car else '' }}" placeholder="11 ABC 111"></label>
  <label>Yıl<input name="year" type="number" value="{{ car.year if car else '' }}" placeholder="2020"></label>
  <label>Günlük Fiyat ₺<input name="daily_price" type="number" step="0.01" required value="{{ car.daily_price if car else '' }}" placeholder="1500"></label>
  <label>Durum
    <select name="status">
      <option {% if car and car.status=='Müsait' %}selected{% endif %}>Müsait</option>
      <option {% if car and car.status=='Kirada' %}selected{% endif %}>Kirada</option>
      <option {% if car and car.status=='Bakımda' %}selected{% endif %}>Bakımda</option>
    </select>
  </label>
  <label>Resim<input name="image" type="file" accept="image/*"></label>
  <label class="full">Not<textarea name="note" rows="3">{{ car.note if car else '' }}</textarea></label>
  <button class="btn full">Kaydet</button>
</form>
{% endblock %}
